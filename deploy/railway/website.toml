[build]
  dockerfilePath = "Dockerfile.next"

  [build.args]
    APP_NAME = "website"
    # NEXT_PUBLIC_* vars are passed automatically from Railway service env vars
    # because they match ARG names in Dockerfile.next — set them in the dashboard.

[deploy]
  healthcheckPath = "/"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
