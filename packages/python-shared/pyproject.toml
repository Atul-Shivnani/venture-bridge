[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "venturebridge-shared"
version = "0.1.0"
dependencies = [
    "sqlalchemy==2.0.40",
    "psycopg2-binary==2.9.10",
    "python-jose[cryptography]==3.3.0",
    "python-dotenv==1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
